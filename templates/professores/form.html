{% extends "base.html" %}
{% block title %}{{ titulo }} - Sistema Escolar{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card card-suave p-4">
            <h4 class="fw-bold mb-4"><i class="bi bi-person-badge"></i> {{ titulo }}</h4>

            {% if professor %}
            <div class="text-center mb-3">
                <img src="{{ professor.foto }}" class="avatar-lg" alt="foto atual">
            </div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome completo</label>
                    <input type="text" name="nome" class="form-control" required
                           value="{{ professor.nome if professor else '' }}" placeholder="Ex: Ana Ferreira">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">E-mail</label>
                    <input type="email" name="email" class="form-control" required
                           value="{{ professor.email if professor else '' }}" placeholder="professor@escola.com">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Especialidade / Área</label>
                    <input type="text" name="especialidade" class="form-control" required
                           value="{{ professor.especialidade if professor else '' }}" placeholder="Ex: Matemática">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">URL da foto <span class="text-muted fw-normal">(opcional)</span></label>
                    <input type="url" name="foto" class="form-control"
                           value="{{ professor.foto if professor else '' }}" placeholder="Deixe em branco para gerar automaticamente">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-acao px-4">
                        <i class="bi bi-check-circle"></i> Salvar
                    </button>
                    <a href="{{ url_for('professores.listar') }}" class="btn btn-outline-secondary btn-acao px-4">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
