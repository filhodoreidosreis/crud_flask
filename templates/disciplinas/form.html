{% extends "base.html" %}
{% block title %}{{ titulo }} - Sistema Escolar{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card card-suave p-4">
            <h4 class="fw-bold mb-4"><i class="bi bi-journal-plus"></i> {{ titulo }}</h4>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome da disciplina</label>
                    <input type="text" name="nome" class="form-control" required
                           value="{{ disciplina.nome if disciplina else '' }}" placeholder="Ex: Banco de Dados">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Carga horária (horas)</label>
                    <input type="number" name="carga_horaria" min="1" class="form-control" required
                           value="{{ disciplina.carga_horaria if disciplina else '' }}">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Professor responsável</label>
                    <select name="professor_id" class="form-select">
                        <option value="">-- Nenhum --</option>
                        {% for p in professores %}
                        <option value="{{ p.id }}"
                            {{ 'selected' if disciplina and disciplina.professor_id == p.id }}>
                            {{ p.nome }} ({{ p.especialidade }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-acao px-4">
                        <i class="bi bi-check-circle"></i> Salvar
                    </button>
                    <a href="{{ url_for('disciplinas.listar') }}" class="btn btn-outline-secondary btn-acao px-4">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
