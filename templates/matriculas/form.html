{% extends "base.html" %}
{% block title %}Nova Matrícula - Sistema Escolar{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card card-suave p-4">
            <h4 class="fw-bold mb-4"><i class="bi bi-journal-plus"></i> Nova Matrícula</h4>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Aluno</label>
                    <select name="aluno_id" class="form-select" required>
                        <option value="">-- Selecione o aluno --</option>
                        {% for a in alunos %}
                        <option value="{{ a.id }}">{{ a.nome }} ({{ a.turma }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Disciplina</label>
                    <select name="disciplina_id" class="form-select" required>
                        <option value="">-- Selecione a disciplina --</option>
                        {% for d in disciplinas %}
                        <option value="{{ d.id }}">{{ d.nome }} ({{ d.carga_horaria }}h)</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-acao px-4">
                        <i class="bi bi-check-circle"></i> Matricular
                    </button>
                    <a href="{{ url_for('matriculas.listar') }}" class="btn btn-outline-secondary btn-acao px-4">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
